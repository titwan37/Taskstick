---
- name: Deploy Taskstick (Co-existence Mode)
  hosts: webserver
  become: yes
  vars:
    # Matches taskstick_dir from deploy_master.yml
    app_dir: "/var/www/taskstick"
    node_version: "20.x"

  tasks:
    # - name: Wait for apt lock
    #   shell: |
    #     while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
    #       echo "Waiting for apt lock..."
    #       sleep 5
    #     done
    #   register: lock_wait
    #   changed_when: false

    - name: Ensure Global Dependencies
      shell: |
        if ! command -v node &> /dev/null; then
          curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
          apt-get install -y nodejs rsync
        fi
        if ! command -v pm2 &> /dev/null; then
          npm install -g pm2 serve
        fi

    - name: Create app directory
      file: path={{ app_dir }} state=directory owner=www-data group=www-data
        mode='0755'

    - name: Sync project files
      synchronize:
        src: ./
        dest: "{{ app_dir }}/"
        recursive: yes
        delete: yes
        rsync_opts:
          - "-c"
          - "--no-perms"
          - "--no-owner"
          - "--no-group"
          - "--exclude=node_modules"
          - "--exclude=dist"
          - "--exclude=.git"
          - "--exclude=.angular"
          - "--exclude=.vscode"
      delegate_to: localhost
      become: no

    - name: Build and Start Taskstick
      shell: |
        npm install --legacy-peer-deps
        npm run build -- --base-href /taskstick/
        pm2 delete taskstick || true
        pm2 start serve --name "taskstick" -- -s dist/Taskstick/browser -p 3034
        pm2 save
        # sudo nginx -t && sudo systemctl restart nginx
      args:
        chdir: "{{ app_dir }}"

    - name: Verify Service Port
      wait_for:
        port: 3034
        timeout: 30
