---
- name: Deploy Taskstick to IONOS (Co-existence Mode)
  hosts: taskstick
  vars:
    app_dir: "/var/www/taskstick"
    node_version: "20.x"
    app_port: 3034

  tasks:
    - name: Update apt cache
      become: yes
      apt: update_cache=yes

    - name: Install Node.js and PM2
      become: yes
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
        apt-get install -y nodejs rsync
        npm install pm2 -g

    - name: Create dedicated app directory
      become: yes
      file: path={{ app_dir }} state=directory owner=root group=root mode='0755'

    - name: Sync project files
      synchronize:
        src: ./
        dest: "{{ app_dir }}/"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.next"
          - "--exclude=node_modules"
          - "--exclude=ansible"
          - "--exclude=.git"
      delegate_to: localhost
      become: no

    - name: Build Application
      become: yes
      shell: |
        npm install --legacy-peer-deps
        npm run build
      args:
        chdir: "{{ app_dir }}"

    - name: Start App on Port {{ app_port }} via PM2
      become: yes
      shell: |
        pm2 delete taskstick || true
        PORT={{ app_port }} pm2 start npm --name "taskstick" -- start
      args:
        chdir: "{{ app_dir }}"

    - name: Create Unique Nginx Config
      become: yes
      copy:
        dest: /etc/nginx/sites-available/taskstick
        content: |
          server {
              listen 81; 
              server_name 212.227.39.191;
              location / {
                  proxy_pass http://localhost:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
              }
          }

    - name: Enable Site and Restart Nginx
      become: yes
      file:
        src: /etc/nginx/sites-available/taskstick
        dest: /etc/nginx/sites-enabled/taskstick
        state: link
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      become: yes
      service: name=nginx state=restarted
